# What "done" means for client/examples/pick_place.py ur. Judged by client/bench/run.py, never by the task script.
scene: config/ur10e_robotiq.yaml     # recorded in the score file
hold: 1.0                            # every rule must still pass this many sim seconds later (it stayed, not just passed by)

rules:
  - name: cube_on_target
    body: cube
    near: [0.35, 0.0, 0.03]          # a world point...
    within: 0.01                     # metres

  - name: cylinder_not_knocked
    body: cylinder
    near: [0.6, -0.2, 0.05]          # ...or another body's name instead of a point
    within: 0.02
